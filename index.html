<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f1f4e9">
    <title>ロードモポ - 無意味な徒労から人類を解放するカウントダウン</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Serif:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/styles.css">
  </head>
  <body>
    <main class="timer-page">
      <header class="page-header">
        <div class="brand-mark" aria-hidden="true">R</div>
        <div class="header-copy">
          <p class="eyebrow">ROHDOMOPO / 01</p>
          <h1>無意味な徒労から<br>人類を解放する</h1>
        </div>
      </header>

      <section class="timer-panel" aria-labelledby="timer-status">
        <div class="section-label">
          <span class="section-label-line" aria-hidden="true"></span>
          <p class="timer-status" id="timer-status" aria-live="polite">徒労のカウントダウンを開始する</p>
          <span class="section-label-line" aria-hidden="true"></span>
        </div>
        <p class="timer-message" id="timer-message" hidden></p>
        <p class="timer-display" id="timer-display" aria-label="残り時間 5分 0秒">05:00.00</p>
        <p class="timer-caption">短い作業と、長い休息のための時計</p>
        <button class="timer-button" id="timer-toggle" type="button">
          <span>カウントダウンを開始</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>
      </section>

      <footer class="page-footer">
        <p><span>WORK</span> 05:00 <i aria-hidden="true">/</i> <span>REST</span> 25:00</p>
        <p class="footer-note">逆さまのポモドーロ</p>
      </footer>
    </main>
    <script type="module" src="assets/scripts/timer.js"></script>
  </body>
</html>
